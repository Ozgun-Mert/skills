/* Layout: research-terminal sheet. Sticky control bar; main = KPI strip, filters, ranked table, comparison grid; detail = sticky section rail + stacked sections. */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --surface-2: #eef1f4;
  --fg: #12161c;
  --fg-2: #4a5360;
  --fg-3: #7a8491;
  --line: #dde2e8;
  --accent: #1d5c63;
  --accent-soft: #dcebec;
  --focus: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b; --neutral-mid: #f0efec;
  --good-ink: #0a6e0a; --warning-ink: #8a5a00; --critical-ink: #a42828;
  --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #256abf; --seq-6: #184f95;
  --grid: #e6e9ee;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --surface: #171b21; --surface-2: #1e232a; --fg: #e8ebef; --fg-2: #b2bac4; --fg-3: #8590a0;
    --line: #2a3038; --accent: #6fbfc2; --accent-soft: #1b3436; --focus: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --neutral-mid: #383835; --good-ink: #5fd35f; --warning-ink: #fab219; --critical-ink: #f07a7a;
    --seq-1: #104281; --seq-2: #184f95; --seq-3: #1c5cab; --seq-4: #2a78d6; --seq-5: #5598e7; --seq-6: #86b6ef;
    --grid: #252b33; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --surface: #171b21; --surface-2: #1e232a; --fg: #e8ebef; --fg-2: #b2bac4; --fg-3: #8590a0;
  --line: #2a3038; --accent: #6fbfc2; --accent-soft: #1b3436; --focus: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --neutral-mid: #383835; --good-ink: #5fd35f; --warning-ink: #fab219; --critical-ink: #f07a7a;
  --seq-1: #104281; --seq-2: #184f95; --seq-3: #1c5cab; --seq-4: #2a78d6; --seq-5: #5598e7; --seq-6: #86b6ef;
  --grid: #252b33; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-body); margin: 0; }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.25rem; font-weight: 700; }
h3 { font-size: 0.95rem; font-weight: 600; font-family: var(--font-body); }
.eyebrow { font: 500 0.7rem/1 var(--font-data); text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-3); }
.mono, td.num, .num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1 1 260px; }
.brand .stamp { font: 400 0.75rem var(--font-data); color: var(--fg-3); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 10px; cursor: pointer; font-size: 0.8rem; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }

/* KPI strip */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin-block: 20px 16px; }
.kpi { background: var(--surface); padding: 12px 14px; display: grid; gap: 4px; min-width: 0; }
.kpi .v { font: 600 1.35rem/1.1 var(--font-data); font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 0.78rem; color: var(--fg-2); }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.filters label { display: grid; gap: 3px; font-size: 0.72rem; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.05em; }
.filters input[type="search"], .filters select { border: 1px solid var(--line); background: var(--bg); border-radius: var(--r); padding: 6px 8px; min-width: 0; text-transform: none; letter-spacing: 0; font-size: 0.85rem; color: var(--fg); }
.filters input[type="search"] { width: 180px; max-width: 100%; }
.filters input[type="range"] { width: 130px; accent-color: var(--accent); }
.chipset { display: flex; gap: 4px; }
.chipset button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 10px; font-size: 0.78rem; cursor: pointer; }
.chipset button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

/* tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.84rem; }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 500 0.7rem var(--font-data); text-transform: uppercase; letter-spacing: 0.05em; color: var(--fg-3); background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--fg); }
th[aria-sort="ascending"]::after { content: " ▲"; }
th[aria-sort="descending"]::after { content: " ▼"; }
td.num, th.num { text-align: right; white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--accent-soft); }
tr.subject td { background: var(--accent-soft); font-weight: 600; }
.tick { font: 600 0.85rem var(--font-data); color: var(--accent); }
.muted { color: var(--fg-3); }
.pos { color: var(--good-ink); } .neg { color: var(--critical-ink); }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
.chip i { width: 8px; height: 8px; display: inline-block; font-style: normal; }
.chip.good i { background: var(--good); border-radius: 50%; }
.chip.warning i { background: var(--warning); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.chip.critical i { background: var(--critical); }
.chip.tag { background: var(--accent-soft); border-color: transparent; color: var(--fg); }

/* score meter */
.score { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.meter { width: 44px; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.meter b { display: block; height: 100%; background: var(--accent); border-radius: 0 3px 3px 0; }
td.hl { background: color-mix(in srgb, var(--accent-soft) 60%, transparent); }

/* grids & panels */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; min-width: 0; align-content: start; }
.panel header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.chartbox { position: relative; height: 260px; max-width: 100%; }
.chartbox.tall { height: 320px; }
.chartbox.short { height: 220px; }
.section { display: grid; gap: 16px; padding-block: 28px 4px; scroll-margin-top: 120px; }
.section > h2 { display: flex; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--fg); padding-bottom: 6px; }
.section > h2 .eyebrow { color: var(--accent); }
.sub { display: grid; gap: 10px; }
.prose { max-width: 68ch; color: var(--fg-2); margin: 0; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.kv div { background: var(--surface); padding: 8px 10px; display: grid; gap: 2px; min-width: 0; }
.kv dt { font: 500 0.68rem var(--font-data); text-transform: uppercase; letter-spacing: 0.05em; color: var(--fg-3); }
.kv dd { margin: 0; font: 500 0.95rem var(--font-data); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.note { font-size: 0.75rem; color: var(--fg-3); }

/* detail header */
.dhead { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; margin-top: 20px; }
.dhead .id { display: grid; gap: 8px; align-content: start; }
.dhead .price { font: 600 2rem/1 var(--font-data); font-variant-numeric: tabular-nums; }
.scores3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.scores3 div { background: var(--surface); padding: 12px; display: grid; gap: 6px; }
.scores3 .big { font: 700 1.9rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.scores3 .big small { font: 400 0.8rem var(--font-data); color: var(--fg-3); }
.scores3 .meter { width: 100%; height: 5px; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 54px); z-index: 10; background: var(--bg); display: flex; gap: 4px; overflow-x: auto; padding-block: 8px; border-bottom: 1px solid var(--line); margin-top: 16px; }
.rail a { text-decoration: none; color: var(--fg-2); font-size: 0.8rem; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.rail a:hover { background: var(--surface-2); color: var(--fg); }
.swot { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.swot .panel h3 { display: flex; gap: 8px; align-items: baseline; }
.swot .panel h3 b { font: 700 1.2rem var(--font-display); color: var(--accent); }
.mark-lead { color: var(--good-ink); font-weight: 600; } .mark-par { color: var(--fg-3); } .mark-behind { color: var(--critical-ink); font-weight: 600; }
.heat td.cell { text-align: center; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.unavail td { color: var(--fg-3); font-style: italic; }
footer.foot { margin-top: 40px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 0.75rem; color: var(--fg-3); display: flex; flex-wrap: wrap; gap: 6px 18px; }
@media (max-width: 720px) {
  .dhead { grid-template-columns: 1fr; }
  h1 { font-size: 1.3rem; }
  .scores3 .big { font-size: 1.5rem; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>

const store = { get(k, d) { try { const v = localStorage.getItem("sa:" + k); return v === null ? d : v; } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem("sa:" + k, v); } catch (e) {} } };
const S = { lang: store.get("lang", "en"), horizon: store.get("horizon", "medium"), sort: { key: "score", dir: -1 },
            f: { q: "", sector: "", country: "", cls: "", manip: new Set(), bank: new Set(), min: 0, mcap: 0 } };
const t = k => (UI[S.lang] && UI[S.lang][k]) || UI.en[k] || k;
const L = o => o == null ? "" : typeof o === "string" ? o : (o[S.lang] || o.en || "");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- formatting ---------- */
const nf = (d) => new Intl.NumberFormat(S.lang === "tr" ? "tr-TR" : "en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
function num(v, d = 1) { return v == null || isNaN(v) ? "–" : nf(d).format(v); }
function big(v, cur) {
  if (v == null || isNaN(v)) return "–";
  const a = Math.abs(v), u = [[1e12, "T"], [1e9, "B"], [1e6, "M"], [1e3, "K"]].find(x => a >= x[0]);
  const s = u ? nf(a / u[0] >= 100 ? 0 : 1).format(v / u[0]) + u[1] : nf(0).format(v);
  return cur ? s + " " + cur : s;
}
function pct(v, signed = true, d = 1) {
  if (v == null || isNaN(v)) return "–";
  const s = nf(d).format(v) + "%";
  return signed && v > 0 ? "+" + s : s;
}
function pctCell(v, d = 1) { return `<td class="num ${v > 0 ? "pos" : v < 0 ? "neg" : ""}">${pct(v, true, d)}</td>`; }
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SERIES = () => [1, 2, 3, 4, 5, 6, 7, 8].map(i => css("--s" + i));

/* status chips: kind = risk (L good) or trust (H good) */
function chip(level, kind = "risk") {
  if (!level) return '<span class="muted">–</span>';
  const good = kind === "trust" ? "H" : "L", bad = kind === "trust" ? "L" : "H";
  const cls = level === good ? "good" : level === bad ? "critical" : "warning";
  return `<span class="chip ${cls}"><i aria-hidden="true"></i>${esc(t(level))}</span>`;
}
function scoreCell(v, hl) { return `<td class="num${hl ? " hl" : ""}"><span class="score">${num(v, 1)}<span class="meter" aria-hidden="true"><b style="width:${Math.max(0, Math.min(100, (v || 0) * 10))}%"></b></span></span></td>`; }
function dirSpan(d) { return d === "+" ? '<span class="pos">+</span>' : d === "-" ? '<span class="neg">−</span>' : '<span class="muted">0</span>'; }
function srcLink(stock, s) {
  if (!s) return "";
  if (/^https?:/.test(s)) return `<a href="${esc(s)}" target="_blank" rel="noopener">↗</a>`;
  const hit = (stock.sources || []).find(x => x.id === s);
  return hit ? `<a href="${esc(hit.url)}" target="_blank" rel="noopener" title="${esc(hit.title)}">${esc(s)}</a>` : esc(s);
}
function tbl(head, rows, cls = "") {
  return `<div class="tablewrap"><table class="${cls}"><thead><tr>${head.map(h => typeof h === "string" ? `<th>${esc(h)}</th>` : `<th class="${h.c || ""}">${esc(h.t)}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
}

function baseOpts(extra = {}) {

    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: { mode: "nearest", intersect: false },

               tooltip: { backgroundColor: css("--surface"), titleColor: css("--fg"), bodyColor: css("--fg-2"), borderColor: css("--line"), borderWidth: 1,
                          titleFont: { family: css("--font-data") }, bodyFont: { family: css("--font-data") }, padding: 8 } },
    scales: { x: { ticks: { color: fg2, font: { family: css("--font-data"), size: 11 } }, grid: { color: grid, drawTicks: false }, border: { color: css("--line") } },
              y: { ticks: { color: fg2, font: { family: css("--font-data"), size: 11 } }, grid: { color: grid, drawTicks: false }, border: { display: false } } }
  }, extra);
}
function mk(id, cfg) {
  const el = document.getElementById(id);
  if (!el || !window.Chart) return;
  charts.push(new Chart(el, cfg));
}
const barDs = (label, data, color) => ({ label, data, backgroundColor: color, borderColor: css("--surface"), borderWidth: { top: 0, right: 0, bottom: 0, left: 0 },
  borderRadius: { topLeft: 4, topRight: 4, bottomLeft: 0, bottomRight: 0 }, borderSkipped: "start", maxBarThickness: 28 });
const lineDs = (label, data, color, extra = {}) => Object.assign({ label, data, borderColor: color, backgroundColor: color, borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, tension: 0.15, spanGaps: true }, extra);
const labelPlugin = { id: "pointLabels", afterDatasetsDraw(chart) {
  const { ctx } = chart; ctx.save(); ctx.font = `500 11px ${css("--font-data")}`; ctx.fillStyle = css("--fg");
  chart.data.datasets.forEach((ds, i) => chart.getDatasetMeta(i).data.forEach((pt, j) => { const l = ds.data[j] && ds.data[j].label; if (l) ctx.fillText(l, pt.x + 7, pt.y - 6); }));
  ctx.restore(); } };
function doughnut(id, labels, values) {
  let pairs = labels.map((l, i) => [l, values[i] || 0]).sort((a, b) => b[1] - a[1]);
  if (pairs.length > 8) { const rest = pairs.slice(7).reduce((s, p) => s + p[1], 0); pairs = pairs.slice(0, 7).concat([[t("others"), rest]]); }
  const sum = pairs.reduce((s, p) => s + p[1], 0) || 1;
  mk(id, { type: "doughnut", data: { labels: pairs.map(p => `${p[0]} · ${num(p[1] / sum * 100, 0)}%`), datasets: [{ data: pairs.map(p => p[1]),
    backgroundColor: SERIES().slice(0, pairs.length), borderColor: css("--surface"), borderWidth: 2 }] },
    options: Object.assign(baseOpts(), { cutout: "58%", scales: {}, plugins: Object.assign(baseOpts().plugins, { legend: { position: "right", labels: baseOpts().plugins.legend.labels } }) }) });
}

function heatCell(v) {

}
function worldPanel() {

function footer() {

}
function bindMain() {
  const rerender = () => renderMain();
  const keepFocus = (id, fn) => document.getElementById(id).addEventListener("input", e => { fn(e.target.value); rerender(); const el = document.getElementById(id); el.focus(); if (el.setSelectionRange && el.type === "search") el.setSelectionRange(el.value.length, el.value.length); });
  keepFocus("f-q", v => S.f.q = v);
  ["sector", "country", "cls"].forEach(k => document.getElementById("f-" + k).addEventListener("change", e => { S.f[k] = e.target.value; rerender(); }));
  document.getElementById("f-mcap").addEventListener("change", e => { S.f.mcap = +e.target.value; rerender(); });
  keepFocus("f-min", v => S.f.min = +v);
  document.querySelectorAll("#f-manip button").forEach(b => b.addEventListener("click", () => { const v = b.dataset.v; S.f.manip.has(v) ? S.f.manip.delete(v) : S.f.manip.add(v); rerender(); }));
  document.querySelectorAll("#f-bank button").forEach(b => b.addEventListener("click", () => { const v = b.dataset.v; S.f.bank.has(v) ? S.f.bank.delete(v) : S.f.bank.add(v); rerender(); }));
  document.getElementById("f-reset").addEventListener("click", () => { S.f = { q: "", sector: "", country: "", cls: "", manip: new Set(), bank: new Set(), min: 0, mcap: 0 }; rerender(); });
  document.querySelectorAll("#main-table th.sortable").forEach(th => { const go = () => { const k = th.dataset.k; const cur = S.sort.key === "score" ? S.horizon : S.sort.key; S.sort = { key: k, dir: cur === k ? -S.sort.dir : -1 }; rerender(); };
    th.addEventListener("click", go); th.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } }); });
  document.querySelectorAll("#main-table tr.click").forEach(tr => { const go = () => openStock(tr.dataset.t); tr.addEventListener("click", go); tr.addEventListener("keydown", e => { if (e.key === "Enter") go(); }); });
}
function drawMainCharts(list) {
  killCharts();
  const ser = SERIES();
  const tick = list.map(s => s.meta.ticker);
  mk("c-scores", { type: "bar", data: { labels: tick, datasets: ["short", "medium", "long"].map((h, i) => barDs(`${t(h)} (${t(h + "H")})`, list.map(s => s.scores[h]), ser[i])) },
    options: baseOpts({ scales: Object.assign(baseOpts().scales, { y: Object.assign(baseOpts().scales.y, { min: 0, max: 10 }) }) }) });
  const pts = list.filter(s => s.snapshot.pe_ttm != null && (s.snapshot.rev_cagr_5y_usd ?? s.snapshot.rev_cagr_5y) != null && s.snapshot.pe_ttm > 0)
    .map(s => ({ x: s.snapshot.rev_cagr_5y_usd ?? s.snapshot.rev_cagr_5y, y: s.snapshot.pe_ttm, label: s.meta.ticker, r: 4 + Math.sqrt((s.snapshot.market_cap_usd || 0) / 1e9) / 6 }));
  mk("c-scatter", { type: "bubble", data: { datasets: [{ label: t("pe"), data: pts, backgroundColor: ser[0] + "cc", borderColor: css("--surface"), borderWidth: 2 }] },
    options: baseOpts({ layout: { padding: { right: 48, top: 14 } }, plugins: Object.assign(baseOpts().plugins, { legend: { display: false }, tooltip: Object.assign(baseOpts().plugins.tooltip, { callbacks: { label: c => `${c.raw.label}: P/E ${num(c.raw.y, 1)} · CAGR ${pct(c.raw.x)}` } }) }) }), plugins: [labelPlugin] });
  let idxList = list.slice().sort((a, b) => (b.snapshot.market_cap_usd || 0) - (a.snapshot.market_cap_usd || 0));
  document.getElementById("cap-note").textContent = idxList.length > 8 ? t("capNote") : t("usdNote");
  idxList = idxList.slice(0, 8);
  const years = [...new Set(idxList.flatMap(s => s.s3.years.filter(y => !y.ttm).map(y => +y.fy)))].sort();
  mk("c-index", { type: "line", data: { labels: years, datasets: idxList.map(s => {
      const ys = s.s3.years.filter(y => !y.ttm).map(y => ({ fy: +y.fy, v: y.revenue_usd ?? y.revenue })).sort((a, b) => a.fy - b.fy);
      const b0 = ys.find(y => y.v)?.v;
      return lineDs(s.meta.ticker, years.map(fy => { const r = ys.find(y => y.fy === fy); return r && b0 ? +(r.v / b0 * 100).toFixed(1) : null; }), ser[colorIdx.get(s.meta.ticker)], { pointRadius: 3 });
    }) }, options: baseOpts() });
  mk("c-banks", { type: "bar", data: { labels: tick, datasets: [Object.assign(barDs(t("medUpside"), list.map(s => s.s5.consensus.median_upside_pct), ser[0]),
      { backgroundColor: list.map(s => s.s5.summary_tag === "Insufficient" ? css("--fg-3") : (s.s5.consensus.median_upside_pct || 0) < 0 ? css("--s8") : css("--s1")) })] },
    options: baseOpts({ plugins: Object.assign(baseOpts().plugins, { legend: { display: false } }),
      scales: Object.assign(baseOpts().scales, { y: Object.assign(baseOpts().scales.y, { ticks: Object.assign(baseOpts().scales.y.ticks, { callback: v => v + "%" }) }) }) }) });
  mk("c-margins", { type: "bar", data: { labels: tick, datasets: [["gross_margin_pct", "gross"], ["op_margin_pct", "op"], ["net_margin_pct", "net"]].map(([k, l], i) =>
      barDs(t(l), list.map(s => { const y = s.s3.years.filter(y => !y.ttm)[0]; return y ? y[k] : null; }), ser[i])) },
    options: baseOpts({ scales: Object.assign(baseOpts().scales, { y: Object.assign(baseOpts().scales.y, { ticks: Object.assign(baseOpts().scales.y.ticks, { callback: v => v + "%" }) }) }) }) });
}

        <div class="panel"><header><h3>${t("consensus")}</h3></header>${kvs([[t("low"), num(s4.consensus.low, 2)], [t("mean"), num(s4.consensus.mean, 2)], [t("high"), num(s4.consensus.high, 2)], [t("buy"), num(s4.consensus.buy, 0)], [t("hold"), num(s4.consensus.hold, 0)], [t("sell"), num(s4.consensus.sell, 0)]])}</div></div></div>
    <div class="sub"><h3>${t("forecast")} · <span class="mono ${s4.forecast_1m.expected_move_pct >= 0 ? "pos" : "neg"}">${pct(s4.forecast_1m.expected_move_pct)}</span> <span class="note">${t("expMove")}</span></h3>
      <div class="grid2"><div style="min-width:0;display:grid;gap:12px;align-content:start">${tbl([t("scenario"), N(t("move")), N(t("tgt")), N(t("prob")), t("driver")], ["bear", "base", "bull"].map(n => s4.forecast_1m.scenarios.find(x => x.name === n)).filter(Boolean).map(x => `<tr><td><b>${t(x.name)}</b></td>${pctCell(x.move_pct)}<td class="num">${num(x.target, 2)}</td><td class="num">${num(x.probability_pct, 0)}%</td><td class="muted">${esc(L(x.driver))}</td></tr>`))}
        ${kvs([[t("rsi"), num(s4.forecast_1m.inputs.rsi, 1)], [t("vs50"), pct(s4.forecast_1m.inputs.vs_sma50_pct)], [t("vs200"), pct(s4.forecast_1m.inputs.vs_sma200_pct)], [t("vol30"), pct(s4.forecast_1m.inputs.vol_30d_pct, false)]])}</div>
        <div class="panel"><div class="chartbox short"><canvas id="d-scen"></canvas></div></div></div>
      ${s4.forecast_1m.catalysts.length ? `<h3>${t("catalysts")}</h3>` + tbl([t("date"), t("event")], s4.forecast_1m.catalysts.map(c => `<tr><td class="mono">${esc(c.date)}</td><td>${esc(L(c.event))}</td></tr>`)) : ""}</div>
    <div class="grid2">
      <div class="sub"><h3>${t("manipIdx")} · ${chip(s4.manipulation.level)}</h3>${tbl([t("input"), N(t("value")), N(t("points"))], s4.manipulation.inputs.map(x => `<tr><td>${esc(L(x.input))}</td><td class="num">${typeof x.value === "number" ? (Math.abs(x.value) >= 1e5 ? big(x.value) : num(x.value, 2)) : esc(x.value ?? "–")}</td><td class="num">${num(x.points, 0)}</td></tr>`).concat([`<tr><td><b>${t("total")}</b></td><td class="num muted">0–5 L · 6–11 M · ≥12 H</td><td class="num"><b>${num(s4.manipulation.total_points, 0)}</b></td></tr>`]))}</div>
      <div class="sub"><h3>${t("ceoT")} · ${esc(s4.ceo.name)} ${s4.ceo.since ? `<span class="note">(${esc(s4.ceo.since)})</span>` : ""} · <span class="mono">${num(s4.ceo.score, 1)}/10</span> ${chip(s4.ceo.trust, "trust")}</h3>${tbl([t("criterion"), t("value"), N(t("points")), ""], s4.ceo.rows.map(r => `<tr><td>${esc(L(r.criterion))}</td><td class="muted">${esc(L(r.value))}</td><td class="num">${num(r.points, 1)}</td><td>${srcLink(s, r.source)}</td></tr>`))}</div>
    </div>
    <div class="sub"><h3>${t("worldT")}</h3>${tbl([t("theme"), t("channel"), t("dir"), t("risk"), t("hz"), t("conf")], s4.world_exposure.map(w => `<tr><td><b>${esc(L(w.theme))}</b></td><td class="muted">${esc(L(w.channel))}</td><td class="mono">${dirSpan(w.direction)}</td><td>${sev(w.risk)}</td><td class="mono">${esc(t(w.horizon))}</td><td class="mono">${esc(w.confidence ? t(w.confidence) : "–")}</td></tr>`))}</div>
    <div class="sub"><h3>${t("newsT")}</h3>${tbl([t("date"), t("outlet"), t("headline"), t("dir"), t("impact"), t("hz"), t("pricedIn")], s4.news.map(n => `<tr><td class="mono">${esc(n.date)}</td><td class="mono">${esc(n.outlet)}</td><td><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.headline)}</a></td><td class="mono">${dirSpan(n.direction)}</td><td>${sev(n.impact)}</td><td class="mono">${esc(t(n.horizon))}</td><td class="mono">${esc(t(n.priced_in))}</td></tr>`))}</div>
  </section>

  ${bankSection(s)}
  <section class="section" id="secS"><h2><span class="eyebrow">06</span>${t("scoreT")}</h2>
    ${tbl([t("component"), t("sub"), N(t("weightIn")), N(t("sc")), N(t("short")), N(t("medium")), N(t("long"))], scoreRows(s))}
  </section>
  <section class="section" id="secSrc"><h2><span class="eyebrow">07</span>${t("src")}</h2>
    ${tbl(["#", t("headline"), t("date")], s.sources.map(x => `<tr><td class="mono">${esc(x.id)}</td><td><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></td><td class="mono">${esc(x.date || "")}</td></tr>`))}
  </section>
  ${footer()}`;
  document.querySelectorAll(".rail a").forEach(a => a.addEventListener("click", e => { e.preventDefault(); const el = document.getElementById(a.dataset.jump); if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }));
  drawDetailCharts(s);
}
function chipCls(level, kind = "risk") { const good = kind === "trust" ? "H" : "L", bad = kind === "trust" ? "L" : "H"; return level === good ? "good" : level === bad ? "critical" : "warning"; }
function ratingChip(r) {
  if (!r) return '<span class="muted">–</span>';
  const cls = r === "Buy" ? "good" : r === "Sell" ? "critical" : "warning";
  return `<span class="chip ${cls}"><i aria-hidden="true"></i>${esc(t(r))}</span>`;
}
function bankTagChip(tag) {
  const cls = tag === "Buy-majority" ? "good" : tag === "Sell-majority" ? "critical" : tag === "Mixed" ? "warning" : "";
  return cls ? `<span class="chip ${cls}"><i aria-hidden="true"></i>${esc(t(tag))}</span>` : `<span class="chip">${esc(t(tag))}</span>`;
}
function srcLinkN(stock, u, n) {
  if (/^https?:/.test(u)) return `<a href="${esc(u)}" target="_blank" rel="noopener" title="${esc(u)}">[${n}]</a>`;
  return srcLink(stock, u);
}
function bankSection(s) {
  const s5 = s.s5, c = s5.consensus, cur = s.meta.currency, win = t("s5Window").replace("{d}", s5.window_days);
  const topics = (arr, st) => st === "no_coverage" ? '<span class="muted">–</span>' : st === "not_reported" ? `<span class="muted">${t("notReported")}</span>`
    : arr.map(x => esc(L(x))).join("<br>");
  const rows = s5.rows.map(r => r.covered ? `<tr><td><b>${esc(r.bank)}</b></td><td><span class="chip">${esc(t(r.role))}</span></td>
      <td style="white-space:nowrap">${esc(r.rating_raw || "")} → ${ratingChip(r.rating)}</td>
      <td class="num">${num(r.target, 2)} <span class="muted">${esc(r.target_currency || cur)}</span>${r.target_currency && r.target_currency !== cur ? `<br><span class="note">${t("adrNote")} ${esc(r.target_listing || "")} · ≈ ${num(r.target_report_ccy, 2)} ${esc(cur)}</span>` : ""}</td>
      ${pctCell(r.upside_pct)}<td class="mono" style="white-space:nowrap">${esc(r.date || "")}</td><td class="mono">${esc(L(r.action) || "–")}</td>
      <td style="min-width:180px">${topics(r.important, r.topics_status)}</td><td class="muted" style="min-width:180px">${topics(r.niche, r.topics_status)}</td>
      <td>${srcLink(s, r.source)}${(r.topic_sources || []).map((u, i) => " " + srcLinkN(s, u, i + 1)).join("")}</td></tr>`
    : `<tr class="unavail"><td><b>${esc(r.bank)}</b></td><td><span class="chip">${esc(t(r.role))}</span></td><td colspan="8">${t("noCov")} · ${esc(win)}</td></tr>`);
  const kv = [[t("bankView"), bankTagChip(s5.summary_tag)], [t("coveredFixed"), `${c.covered_fixed}/4`], [t("Buy"), c.buy], [t("Hold"), c.hold], [t("Sell"), c.sell],
    [t("medTarget"), `${num(c.median_target, 2)} ${esc(cur)}`], [t("medUpside"), `<span class="${c.median_upside_pct >= 0 ? "pos" : "neg"}">${pct(c.median_upside_pct)}</span>`], [t("revisions"), `${c.raises} / ${c.lowers}`]];
  const histCur = (s5.rows.find(r => r.covered && r.target_currency) || {}).target_currency || cur;
  return `<section class="section" id="sec5"><h2><span class="eyebrow">05</span>${t("s5T")} <span class="note">${esc(win)}</span></h2>
    <dl class="kv">${kv.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${v}</dd></div>`).join("")}</dl>
    ${tbl([t("bank"), t("role"), t("ratingCol"), N(t("tgt")), N(t("upside")), t("date"), t("action"), t("important"), t("niche"), ""], rows)}
    <div class="grid2"><div class="panel"><header><h3>${t("upsideByBank")}</h3><span class="note">${t("sameCcyNote")}</span></header><div class="chartbox short"><canvas id="d-bank-up"></canvas></div></div>
      <div class="panel"><header><h3>${t("ptHistory")}</h3><span class="note">${esc(histCur)}</span></header><div class="chartbox short"><canvas id="d-bank-hist"></canvas></div></div></div>
  </section>`;
}
const HW = { short: { C1: 5, C2: 10, C3: 10, C4a: 20, C4b: 45, C5: 10 }, medium: { C1: 15, C2: 15, C3: 20, C4a: 20, C4b: 15, C5: 15 }, long: { C1: 30, C2: 20, C3: 25, C4a: 10, C4b: 5, C5: 10 } };
function scoreRows(s) {
  const names = { C1: t("s1"), C2: t("s2"), C3: t("s3"), C4a: t("valuation").replace(/^4a · /, ""), C4b: t("risk"), C5: t("s5T") };
  const rows = [];
  ["C1", "C2", "C3", "C4a", "C4b", "C5"].forEach(c => {
    const comp = s.scores.components[c];
    rows.push(`<tr class="subject"><td>${c} ${esc(names[c])}</td><td></td><td></td><td class="num">${num(comp.score, 1)}</td>${["short", "medium", "long"].map(h => `<td class="num">${HW[h][c]}%</td>`).join("")}</tr>`);
    comp.subs.forEach(x => rows.push(`<tr><td></td><td>${esc(L(x.label))}${x.note ? ` <span class="note">· ${esc(L(x.note))}</span>` : ""}</td><td class="num">${num(x.weight * 100, 0)}%</td><td class="num">${num(x.score, 1)}</td><td></td><td></td><td></td></tr>`));
  });
  rows.push(`<tr><td><b>${t("final")}</b></td><td></td><td></td><td></td>${["short", "medium", "long"].map(h => `<td class="num"><b>${num(s.scores[h], 1)}/10</b></td>`).join("")}</tr>`);
  return rows;
}
function drawDetailCharts(s) {
  killCharts();
  const ser = SERIES(), ps = s.price_series;
  mk("d-price", { type: "line", data: { labels: ps.dates, datasets: [lineDs(t("close"), ps.close, ser[0], { fill: { target: "origin", above: ser[0] + "1f" } }),
      lineDs(t("sma50"), ps.sma50 || [], ser[1], { borderWidth: 1.5 }), lineDs(t("sma200"), ps.sma200 || [], ser[2], { borderWidth: 1.5 })] },
    options: baseOpts({ interaction: { mode: "index", intersect: false }, scales: { x: Object.assign(baseOpts().scales.x, { ticks: Object.assign(baseOpts().scales.x.ticks, { maxTicksLimit: 6 }) }), y: baseOpts().scales.y } }) });
  doughnut("d-seg", s.s1.segments.map(g => L(g.name)), s.s1.segments.map(g => g.revenue ?? g.pct));
  s.s2.markets.forEach((k, i) => doughnut(`d-mkt-${i}`, k.shares.map(x => x.company), k.shares.map(x => x.pct)));
  const ys = s.s3.years.filter(y => !y.ttm).slice().sort((a, b) => a.fy - b.fy);
  mk("d-fin", { type: "bar", data: { labels: ys.map(y => y.fy), datasets: [barDs(t("revenue"), ys.map(y => y.revenue), ser[0]), barDs(t("ni"), ys.map(y => y.net_income), ser[1])] },
    options: baseOpts({ scales: Object.assign(baseOpts().scales, { y: Object.assign(baseOpts().scales.y, { ticks: Object.assign(baseOpts().scales.y.ticks, { callback: v => big(v) }) }) }),
      plugins: Object.assign(baseOpts().plugins, { tooltip: Object.assign(baseOpts().plugins.tooltip, { callbacks: { label: c => `${c.dataset.label}: ${big(c.raw, s.s3.currency)}` } }) }) }) });
  mk("d-growth", { type: "line", data: { labels: ys.map(y => y.fy), datasets: [lineDs(t("revenue"), ys.map(y => y.revenue_yoy_pct), ser[0], { pointRadius: 3 }), lineDs(t("ni"), ys.map(y => y.net_income_yoy_pct), ser[1], { pointRadius: 3 })] },
    options: baseOpts({ scales: Object.assign(baseOpts().scales, { y: Object.assign(baseOpts().scales.y, { ticks: Object.assign(baseOpts().scales.y.ticks, { callback: v => v + "%" }) }) }) }) });
  const mu = s.s4.multiples.filter(x => x.current != null);
  mk("d-mult", { type: "bar", data: { labels: mu.map(x => x.name), datasets: [barDs(t("current"), mu.map(x => x.current), ser[0]), barDs(t("avg5"), mu.map(x => x.avg_5y), ser[1]), barDs(t("peerMed"), mu.map(x => x.peer_median), ser[2])] },
    options: baseOpts({ indexAxis: "y", scales: baseOpts().scales }) });
  const br = s.s5.rows.filter(r => r.covered && r.upside_pct != null);
  mk("d-bank-up", { type: "bar", data: { labels: br.map(r => r.bank), datasets: [{ label: t("upside"), data: br.map(r => r.upside_pct),
      backgroundColor: br.map(r => r.upside_pct < 0 ? css("--s8") : css("--s1")), borderRadius: 4, borderSkipped: "start", maxBarThickness: 22 }] },
    options: baseOpts({ indexAxis: "y", plugins: Object.assign(baseOpts().plugins, { legend: { display: false } }),
      scales: { x: Object.assign(baseOpts().scales.x, { ticks: Object.assign(baseOpts().scales.x.ticks, { callback: v => v + "%" }) }), y: baseOpts().scales.y } }) });
  const hb = s.s5.rows.filter(r => r.covered && (r.history || []).some(h => h.target != null)).slice(0, 8);
  const dayFmt = v => new Date(v).toISOString().slice(0, 10);
  mk("d-bank-hist", { type: "line", data: { datasets: hb.map((r, i) => lineDs(r.bank, r.history.filter(h => h.target != null)
      .map(h => ({ x: Date.parse(h.date), y: h.target })).sort((a, b) => a.x - b.x), SERIES()[i], { pointRadius: 3, stepped: "before" })) },
    options: baseOpts({ plugins: Object.assign(baseOpts().plugins, { tooltip: Object.assign(baseOpts().plugins.tooltip, { callbacks: { title: c => dayFmt(c[0].parsed.x) } }) }),
      scales: { x: Object.assign(baseOpts().scales.x, { type: "linear", ticks: Object.assign(baseOpts().scales.x.ticks, { maxTicksLimit: 5, callback: v => dayFmt(v) }) }), y: baseOpts().scales.y } }) });
  const sc = ["bear", "base", "bull"].map(n => s.s4.forecast_1m.scenarios.find(x => x.name === n)).filter(Boolean);
  mk("d-scen", { type: "bar", data: { labels: sc.map(x => `${t(x.name)} · ${num(x.probability_pct, 0)}%`), datasets: [{ label: t("move"), data: sc.map(x => x.move_pct),
      backgroundColor: sc.map(x => x.move_pct < 0 ? css("--s8") : x.move_pct > 0 ? css("--s1") : css("--fg-3")), borderRadius: 4, borderSkipped: "start", maxBarThickness: 26 }] },
    options: baseOpts({ indexAxis: "y", plugins: Object.assign(baseOpts().plugins, { legend: { display: false } }),
      scales: { x: Object.assign(baseOpts().scales.x, { ticks: Object.assign(baseOpts().scales.x.ticks, { callback: v => v + "%" }) }), y: baseOpts().scales.y } }) });
}

/* ---------- routing / chrome ---------- */
let current = null;
function openStock(tick) { current = tick; try { history.replaceState(null, "", "#" + tick); } catch (e) {} render(); window.scrollTo(0, 0); }
function goMain() { current = null; try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} render(); }
function render() {
  document.documentElement.lang = S.lang;
  if (window.Chart) Chart.defaults.locale = S.lang === "tr" ? "tr-TR" : "en-US";
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === S.lang)));
  const hs = document.getElementById("horizonSeg");
  hs.innerHTML = ["short", "medium", "long"].map(h => `<button type="button" id="hz-${h}" aria-pressed="${S.horizon === h}" title="${t(h + "H")}">${t(h)}</button>`).join("");
  hs.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { S.horizon = b.id.slice(3); store.set("horizon", S.horizon); render(); }));
  const single = DATA && DATA.mode === "single";
  const s = current && stocks.find(x => x.meta.ticker === current);
  const back = document.getElementById("back");
  back.hidden = !s || single; back.textContent = "← " + t("back");
  hs.hidden = !!s;
  document.getElementById("title").textContent = s ? `${s.meta.ticker} · ${s.meta.name}` : (single ? "" : stocks.map(x => x.meta.ticker).join(" · "));
  document.getElementById("stamp").textContent = `${t("data")} ${(stocks[0] && stocks[0].meta.report_date) || ""}`;
  if (!DATA || !stocks.length) { killCharts(); document.getElementById("app").innerHTML = `<p class="muted" style="margin-top:24px">${t("noMatch")}</p>`; return; }
  s ? renderDetail(s) : renderMain();
}
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => { S.lang = b.dataset.lang; store.set("lang", S.lang); render(); }));
document.getElementById("back").addEventListener("click", goMain);
const themeRedraw = () => { if (!document.getElementById("app").firstChild) return; const s = current && stocks.find(x => x.meta.ticker === current); s ? drawDetailCharts(s) : drawMainCharts(filtered()); };
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", themeRedraw); } catch (e) {}
new MutationObserver(themeRedraw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
(function boot() {
  const h = (location.hash || "").replace("#", "").toUpperCase();
  if (DATA && DATA.mode === "single" && stocks[0]) current = stocks[0].meta.ticker;
  else if (h && stocks.some(x => x.meta.ticker === h)) current = h;
  if (window.Chart) { Chart.defaults.font.family = css("--font-body"); }
  render();
})();
</script>
